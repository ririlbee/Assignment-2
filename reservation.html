<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />	
	<meta name="description" content="Web development">
	<meta name="keywords" content="">
	<meta name="author" content="Reagan">
	<link href="css/style.css" rel="stylesheet" type="text/css">
	<script src="js/script.js"></script>

	<title>Reservations</title>
</head>
<body>
    <header>
        <h1>Make a Reservation</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="restaurants.html">Restaurants</a></li>
            <li><a href="recommend.html">Recommendations</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="reservation.html"  class="active">Reservations</a></li>
        </ul>
    </nav>

    <main>
        <form id="reservationform" method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
            <p><span class="required"></span> Indicates a required field</p>
            
            <fieldset>
                <legend>Personal Details</legend>
                
                <div class="textinput">
                    <label for="fname" class="boldlabel required">First name</label>
                    <input id="fname" type="text" name="fname" placeholder="e.g. John">
                </div>

                <div class="textinput">
                    <label for="lname" class="boldlabel required">Last name</label>
                    <input id="lname" type="text" name="lname" placeholder="e.g. Smith">
                </div>

                <div class="textinput">
                    <label for="resemail" class="boldlabel required">Email</label>
                    <input id="resemail" type="text" name="resemail" placeholder="e.g. john.smith@example.com">
                </div>

                <div class="numinput">
                    <label for="resphone" class="boldlabel required">Phone Number</label>
                    <input id="resphone" type="tel" name="resphone" inputmode="tel" pattern="[0-9\-\s\(\)]{7,20}" placeholder="e.g. 0412 345 678">
                </div>
            </fieldset>

            <fieldset>
                <legend>Reservation Details</legend>

                <!--Input for Restaurant selection-->
                <div class="dropdowninput">
                    <label for="restSelect" class="boldlabel required">Select a Restaurant</label>
                    <select id="restSelect" name="restSelect">
                        <option value="">-- Please choose a restaurant --</option>
                        <option value="The Dough House">The Dough House</option>
                        <option value="Sushi World">Sushi World</option>
                        <option value="Spice Garden">Spice Garden</option>
                        <option value="Green Delight">Green Delight</option>
                        <option value="BBQ Haven">BBQ Haven</option>
                        <option value="Seafood Paradise">Seafood Paradise</option>
                    </select>
                </div>

                <!--A date input for reservation date. Must not be in the past.-->
                <div class="dateinput">
                    <label for="date" class="boldlabel required">Reservation Date</label>
                    <input id="date" type="date" name="date">
                </div>

                <!-- A number input for number of guests. Must be greater than 0. -->
                <div class="dropdowninput">
                    <label for="numguests" class="boldlabel required">Number of people</label>
                    <input id="numguests" type="number" name="numguests" min="1" placeholder="e.g. 2">
                </div>

                <!-- A text input for special requests, which is optional -->
                <div class="textinput">
                    <label for="specreqs" class="boldlabel">Special Requests</label>
                    <input id="specreqs" type="text" name="specreqs" placeholder="e.g. High chair at table">
                </div>
            </fieldset>

            <fieldset>
                <legend>Payment Details</legend>

                <div class="prefilled">
                    <label for="depamount" class="boldlabel required">Deposit Amount</label>
                    <!--PREFILLED CAN'T BE EDITED-->
                    <input id="depamount" type="text" name="depamount" readonly>
                </div>

                <div class="radioinput">
                    <span class="radiolabel required">Deposit Method</span>
                    
                    <input id="voucher" type="radio" name="depmethod" value="voucher">
                    <label for="voucher">Voucher</label>

                    <input id="onlinepayment" type="radio" name="depmethod" value="onlinepayment">
                    <label for="onlinepayment">Online Payment</label>
                </div>

                <div id="voucherInfo" class="numinput hidden">
                    <label for="vcode" class="boldlabel">Voucher Code</label>
                    <input id="vcode" type="number" name="vcode">
                </div>

                <div id="onlineInfo" class="radioinput hidden">
                    <span class="radiolabel">Online Payment Method</span>

                    <input id="visamc" type="radio" name="cardtype" value="visamc">
                    <label for="visamc">Visa/Mastercard</label>

                    <input id="amex" type="radio" name="cardtype" value="amex">
                    <label for="amex">American Express (Amex)</label>

                    <div id="visamcInfo" class="numinput hidden">
                        <label for="visamcCardNum" class="boldlabel">Visa/Mastercard Number</label>
                        <input id="visamcCardNum" type="tel" name="visamcCardNum" inputmode="numeric" maxlength="19" placeholder="xxxx xxxx xxxx xxxx" pattern="[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}">

                        <label for="visamcExpiry" class="boldlabel">Card Expiry Date</label>
                        <input id="visamcExpiry" type="month" name="visamcExpiry">
                    </div>

                    <div id="amexInfo" class="numinput hidden">
                        <label for="amexCardNum" class="boldlabel">American Express Number</label>
                        <input id="amexCardNum" type="tel" name="amexCardNum" inputmode="numeric" maxlength="17" placeholder="xxxx xxxxxx xxxxx" pattern="[0-9]{4}[ -]?[0-9]{6}[ -]?[0-9]{5}">

                        <label for="amexExpiry" class="boldlabel">Card Expiry Date</label>
                        <input id="amexExpiry" type="month" name="amexExpiry">
                    </div>
                </div>
                
                <div class="textinput">
                    <label for="billingemail" class="boldlabel">Billing Email Address</label>
                    <label class="inline-checkbox" for="sameemail">
                        <input id="sameemail" type="checkbox" name="sameemail" value="sameemail">
                        Same as Email Address
                    </label>
                    <input id="billingemail" type="text" name="billingemail">
                </div>
            </fieldset>

            <div class="buttoninput">
                <input type="submit" value="Test Register">
            </div>
        </form>
    </main>

    <footer>
        <!-- &copy adds a copyright symbol -->
        <p>&copy; 2026 Reagan</p>
    </footer>
</body>
